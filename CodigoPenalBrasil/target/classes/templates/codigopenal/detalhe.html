<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecalho('Detalhe do Artigo')}"></head>
<body>

<nav th:replace="~{fragmentos/layout :: menu}"></nav>

<main class="container">
    <div class="card cartao-artigo mx-auto" style="max-width: 720px;">
        <div class="card-header card-header-artigo d-flex justify-content-between align-items-center">
            <strong th:text="${codigoPenal.artigo}">Art. 121</strong>
            <span class="badge badge-tipo-lei" th:if="${codigoPenal.tipoLei}" th:text="${codigoPenal.tipoLei}">Lei</span>
        </div>
        <div class="card-body">
            <h5 th:if="${codigoPenal.tituloLei}" th:text="${codigoPenal.tituloLei}" class="mb-3">Título da Lei</h5>
            <p class="card-text" th:text="${codigoPenal.descricaoArtigo}" style="white-space: pre-line;">Descrição...</p>

            <div class="d-flex gap-2 mt-4 flex-wrap">
                <a class="btn btn-outline-secondary" th:href="@{/codigospenais}">Voltar</a>
                <a class="btn btn-primary" th:href="@{/codigospenais/{id}/editar(id=${codigoPenal.id})}">Editar</a>
                <form th:action="@{/codigospenais/{id}/excluir(id=${codigoPenal.id})}" method="post"
                      onsubmit="return confirm('Confirma a exclusão deste artigo?');">
                    <button type="submit" class="btn btn-outline-danger">Excluir</button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragmentos/layout :: rodape}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
