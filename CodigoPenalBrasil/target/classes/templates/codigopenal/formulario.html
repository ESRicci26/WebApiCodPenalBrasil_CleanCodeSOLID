<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecalho(${modoEdicao} ? 'Editar Artigo' : 'Novo Artigo')}"></head>
<body>

<nav th:replace="~{fragmentos/layout :: menu}"></nav>

<main class="container">
    <div class="card cartao-artigo mx-auto" style="max-width: 720px;">
        <div class="card-header card-header-artigo">
            <h5 class="mb-0" th:text="${modoEdicao} ? 'Editar Artigo do Código Penal' : 'Cadastrar Novo Artigo'">Formulário</h5>
        </div>
        <div class="card-body">

            <form th:action="${modoEdicao} ? @{/codigospenais/{id}(id=${codigoPenalRequisicaoDTO.id})} : @{/codigospenais}"
                  th:object="${codigoPenalRequisicaoDTO}" method="post" novalidate>

                <div class="mb-3">
                    <label class="form-label" for="artigo">Artigo *</label>
                    <input type="text" class="form-control" id="artigo" th:field="*{artigo}"
                           placeholder="Ex: Art. 121" maxlength="20"/>
                    <div class="text-danger small" th:if="${#fields.hasErrors('artigo')}" th:errors="*{artigo}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="descricaoArtigo">Descrição do Artigo *</label>
                    <textarea class="form-control" id="descricaoArtigo" th:field="*{descricaoArtigo}" rows="6"
                              placeholder="Texto integral do artigo"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('descricaoArtigo')}" th:errors="*{descricaoArtigo}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="tituloLei">Título da Lei</label>
                    <input type="text" class="form-control" id="tituloLei" th:field="*{tituloLei}"
                           placeholder="Ex: Decreto-Lei nº 2.848, de 7 de dezembro de 1940"/>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="tipoLei">Tipo de Lei</label>
                    <input type="text" class="form-control" id="tipoLei" th:field="*{tipoLei}"
                           placeholder="Ex: Código Penal"/>
                </div>

                <div class="d-flex gap-2 mt-4 flex-wrap">
                    <a class="btn btn-outline-secondary" th:href="@{/codigospenais}">Cancelar</a>
                    <button type="submit" class="btn btn-primary" th:text="${modoEdicao} ? 'Salvar Alterações' : 'Cadastrar'">Salvar</button>
                </div>
            </form>

        </div>
    </div>
</main>

<footer th:replace="~{fragmentos/layout :: rodape}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
