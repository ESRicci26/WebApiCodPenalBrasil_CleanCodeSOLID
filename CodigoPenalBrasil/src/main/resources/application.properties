# =========================================================
# Aplicacao
# =========================================================
spring.application.name=CodigoPenalBrasil
server.port=8080

# =========================================================
# Banco de Dados MySQL - codigopenalbrasil / tabela codigopenal
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/codigopenalbrasil?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de Conexoes (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =========================================================
# Thymeleaf
# =========================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =========================================================
# Encoding UTF-8 (importante para acentuacao em portugues)
# =========================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mvc.static-path-pattern=/static/**

# =========================================================
# Logs
# =========================================================
logging.level.com.javaricci=INFO
logging.level.org.springframework.jdbc.core=WARN
