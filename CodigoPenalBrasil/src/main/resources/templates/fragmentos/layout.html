<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabecalho(tituloPagina)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${tituloPagina} + ' - Código Penal Brasil'">Código Penal Brasil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/static/css/estilo.css"/>
</head>
<body>

<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/codigospenais}">⚖️ Código Penal Brasil</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarConteudo">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarConteudo">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/codigospenais}">Listagem</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/codigospenais/novo}">Novo Artigo</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="rodape" class="text-center text-muted py-4 mt-5 border-top">
    <div class="container">
        <small>CodigoPenalBrasil &middot; com.javaricci &middot; Clean Architecture / Hexagonal</small>
    </div>
</footer>

</body>
</html>
